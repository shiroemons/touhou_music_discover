name: Ruby

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

env:
  CI: "true"

jobs:
  # Rubocopによる静的解析
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run Rubocop
        run: |
          bundle exec rubocop --parallel

  # セキュリティスキャン（Brakeman + bundler-audit）
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run Brakeman
        run: |
          bundle exec brakeman --no-pager -q -w2

      # addressable の CVE-2026-35611 は rspotify 2.12.4 が addressable (~> 2.8.0) を
      # 固定しているため解消できない。Issue #563 で rspotify を削除した時点で ignore を外す。
      - name: Run bundler-audit
        run: |
          bundle exec bundler-audit check --update --ignore CVE-2026-35611

  # テストの実行
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Ruby のセットアップ
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: yarn

      # 環境変数の設定
      - name: Set environment variables
        run: |
          echo "PG_HOST=localhost" >> $GITHUB_ENV
          echo "PG_USER=postgres" >> $GITHUB_ENV
          echo "PG_PASSWORD=password" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
          echo "RAILS_ENV=test" >> $GITHUB_ENV

      - name: Install JS dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Build assets
        run: |
          yarn build && yarn build:css

      - name: Database setup
        run: |
          bundle exec rails db:create db:schema:load db:migrate

      # eager_loadを有効化してZeitwerkの整合性を確認
      - name: Zeitwerk check
        run: |
          bundle exec rails zeitwerk:check

      - name: Run test
        run: |
          bundle exec rails test
